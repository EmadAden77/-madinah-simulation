name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: Build authored core in Blender
        run: blender --background --python tools/blender/build_core.py

      - name: Verify Blender outputs
        run: |
          test -f public/assets/city/core.glb
          test -f tools/blender/generated/core-authored.blend
          test -f tools/blender/generated/core-authoring-report.json
          ls -lh public/assets/city/core.glb tools/blender/generated/core-authored.blend tools/blender/generated/core-authoring-report.json

      - name: Upload authored core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: authored-core-blender
          path: |
            public/assets/city/core.glb
            tools/blender/generated/core-authored.blend
            tools/blender/generated/core-authoring-report.json
          if-no-files-found: error

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
